databaseChangeLog:
  - changeSet:
      id: 1
      author: Ruben
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
              - column:
                  name: last_logout
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: Laura
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: course_order
      changes:
        - createTable:
            tableName: course_order
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: purchased_at
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(250)
                  constraints:
                    nullable: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: course_order
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_course_order_user
