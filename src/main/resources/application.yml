spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/holy_infantes
    username: sa
    password: pass
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/holy_infantes?authSource=admin
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mongock:
  migration-scan-package: com.holyinfantes.backend.configuration.migrations.mongo

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.sql: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG

